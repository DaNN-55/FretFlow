<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style A - Bold Signal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e111b;
      --card: #1a2031;
      --text: #f9fafb;
      --muted: #aab0c2;
      --accent: #ff5d3d;
      --title-size: clamp(1.6rem, 6vw, 4.2rem);
      --body-size: clamp(0.82rem, 1.8vw, 1.1rem);
      --slide-padding: clamp(1rem, 4vw, 4rem);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow-x: hidden; scroll-snap-type: y mandatory; }
    body { font-family: Manrope, sans-serif; background: radial-gradient(circle at 10% 20%, #2a1a1a 0%, var(--bg) 45%); color: var(--text); }
    .slide { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; display: flex; padding: var(--slide-padding); }
    .slide-content {
      flex: 1; max-height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
      gap: clamp(0.6rem, 2vw, 1.2rem); border: 1px solid rgba(255, 93, 61, 0.25); border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)); padding: clamp(1rem, 4vw, 3rem);
    }
    h1 { font-family: Outfit, sans-serif; font-size: var(--title-size); letter-spacing: 0.02em; }
    p { font-size: var(--body-size); color: var(--muted); max-width: 58ch; }
    .pill { width: fit-content; padding: 0.4rem 0.8rem; border-radius: 999px; background: var(--accent); color: #101318; font-weight: 700; font-size: clamp(0.7rem, 1.4vw, 0.9rem); }
    .reveal { opacity: 0; transform: translateY(26px); animation: in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .reveal:nth-child(2) { animation-delay: 0.14s; }
    .reveal:nth-child(3) { animation-delay: 0.28s; }
    @keyframes in { to { opacity: 1; transform: translateY(0); } }
    @media (max-height: 700px) { :root { --slide-padding: clamp(0.7rem, 3vw, 2rem); } }
    @media (max-height: 600px) { :root { --title-size: clamp(1.2rem, 5vw, 2.2rem); --body-size: clamp(0.7rem, 1.4vw, 0.95rem); } }
    @media (max-height: 500px) { .pill { display: none; } }
  </style>
</head>
<body>
  <section class="slide">
    <div class="slide-content">
      <span class="pill reveal">STYLE A · BOLD SIGNAL</span>
      <h1 class="reveal">FretFlow Product Showcase</h1>
      <p class="reveal">High-contrast, assertive, and pitch-ready. Strong accent color and bold type hierarchy for confidence.</p>
    </div>
  </section>
</body>
</html>
